
name: LUNA | Sapphire Full Clang Kernel Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Kernel source branch
        required: true
        default: lineage-23.2
        type: string

      clean_build:
        description: Clean kernel output
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: luna-sapphire-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  build:
    name: LUNA - AOSP Clang r522817
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: vendor/sapphire_defconfig

      KBUILD_BUILD_USER: LUNA
      KBUILD_BUILD_HOST: Sapphire
      KBUILD_BUILD_VERSION: 1

      LLVM: "1"
      LLVM_IAS: "1"

      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}

    steps:

      # ==========================================
      # CHECKOUT SOURCE
      # ==========================================

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: mobxprjkt/kernel_xiaomi_sapphire
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          submodules: recursive

      - name: Kernel Information
        shell: bash
        run: |
          set -euo pipefail

          echo "================================"
          echo "KERNEL   : LUNA"
          echo "DEVICE   : Redmi Note 13 4G"
          echo "CODENAME : Sapphire / SapphireN"
          echo "BRANCH   : ${{ inputs.branch }}"
          echo "COMMIT   : $(git rev-parse --short HEAD)"
          echo "VERSION  : $(make kernelversion)"
          echo "DEFCONFIG: $DEFCONFIG"
          echo "================================"

          {
            echo "## LUNA Kernel Information"
            echo "- Device: Redmi Note 13 4G"
            echo "- Codename: Sapphire / SapphireN"
            echo "- Branch: ${{ inputs.branch }}"
            echo "- Commit: $(git rev-parse --short HEAD)"
            echo "- Compiler: AOSP Clang r522817"
          } >> "$GITHUB_STEP_SUMMARY"

      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ca-certificates \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            lz4 \
            pahole \
            python3 \
            python3-pip \
            rsync \
            unzip \
            zip \
            zlib1g-dev \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi

      # ==========================================
      # RESTORE AOSP CLANG CACHE
      # ==========================================

      - name: Restore AOSP Clang Cache
        uses: actions/cache@v4
        with:
          path: .toolchains/clang
          key: luna-clang-r522817-linux-v1

      # ==========================================
      # DOWNLOAD CLANG IF CACHE MISSING
      # ==========================================

      - name: Download AOSP Clang r522817
        shell: bash
        run: |
          set -euo pipefail

          CLANG_DIR="$GITHUB_WORKSPACE/.toolchains/clang"

          mkdir -p "$CLANG_DIR"

          if [ -x "$CLANG_DIR/bin/clang" ] && \
             [ -x "$CLANG_DIR/bin/ld.lld" ] && \
             [ -x "$CLANG_DIR/bin/llvm-ar" ]; then

            echo "Clang cache restored!"
            echo "Skipping download."

          else

            echo "Clang cache missing."
            echo "Downloading AOSP Clang r522817..."

            rm -rf "$CLANG_DIR"
            mkdir -p "$CLANG_DIR"

            URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz"

            curl -fL \
              --retry 5 \
              --retry-delay 3 \
              --retry-all-errors \
              "$URL" \
              -o "$RUNNER_TEMP/clang-r522817.tar.gz"

            tar -xzf "$RUNNER_TEMP/clang-r522817.tar.gz" \
              -C "$CLANG_DIR"

          fi

          test -x "$CLANG_DIR/bin/clang"
          test -x "$CLANG_DIR/bin/ld.lld"
          test -x "$CLANG_DIR/bin/llvm-ar"

          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"

          "$CLANG_DIR/bin/clang" --version

      # ==========================================
      # VERIFY TOOLCHAIN
      # ==========================================

      - name: Verify AOSP Clang
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$CLANG_DIR/bin:$PATH"

          for tool in \
            clang \
            clang++ \
            ld.lld \
            llvm-ar \
            llvm-nm \
            llvm-objcopy \
            llvm-objdump \
            llvm-readelf \
            llvm-strip
          do
            command -v "$tool"
          done

          clang --version
          ld.lld --version

          echo "AOSP Clang r522817 verified!"

      # ==========================================
      # RESTORE CCACHE
      # ==========================================

      - name: Restore LUNA CCache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: luna-ccache-${{ runner.os }}-${{ inputs.branch }}-${{ github.sha }}
          restore-keys: |
            luna-ccache-${{ runner.os }}-${{ inputs.branch }}-
            luna-ccache-${{ runner.os }}-

      # ==========================================
      # CONFIGURE CCACHE
      # ==========================================

      - name: Configure CCache
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$CCACHE_DIR"

          ccache --set-config=max_size=5G
          ccache --set-config=compiler_check=content
          ccache --set-config=base_dir="$GITHUB_WORKSPACE"

          ccache --zero-stats

          echo "========== CCACHE =========="

          ccache --version
          ccache --show-config
          ccache --show-stats

      # ==========================================
      # VALIDATE SOURCE
      # ==========================================

      - name: Validate Kernel Source
        shell: bash
        run: |
          set -euo pipefail

          test -f Makefile
          test -d arch/arm64
          test -f "arch/arm64/configs/$DEFCONFIG"

          echo "Kernel source validated!"

      # ==========================================
      # CLEAN BUILD
      # ==========================================

      - name: Clean Build
        if: inputs.clean_build
        shell: bash
        run: |
          set -euo pipefail

          rm -rf out
          make mrproper

          echo "Kernel output cleaned!"
          echo "Clang cache preserved!"
          echo "CCache preserved!"

      # ==========================================
      # SETUP BUILD ENVIRONMENT
      # ==========================================

      - name: Setup Build Environment
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p out

          echo "KERNEL_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "OUT_DIR=$GITHUB_WORKSPACE/out" >> "$GITHUB_ENV"

      # ==========================================
      # CONFIGURE DEFCONFIG
      # ==========================================

      - name: Configure Sapphire Defconfig
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$CLANG_DIR/bin:$PATH"

          make O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            "$DEFCONFIG"

          test -s out/.config

          echo "Defconfig configured!"

      # ==========================================
      # APPLY LUNA KERNEL IDENTITY
      # ==========================================

      - name: Apply LUNA Kernel Identity
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="out/.config"

          # Set suffix exactly once
          scripts/config --file "$CONFIG" \
            --set-str LOCALVERSION "-LUNA"

          # Disable automatic Git hash
          scripts/config --file "$CONFIG" \
            -d LOCALVERSION_AUTO

          # Reconfigure kernel
          make O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            olddefconfig

          # Remove stale kernel release
          rm -f out/include/config/kernel.release

          echo "========== LUNA CONFIG =========="

          grep -E \
            'CONFIG_LOCALVERSION=|CONFIG_LOCALVERSION_AUTO=' \
            "$CONFIG" || true

          echo "Kernel identity configured!"

      # ==========================================
      # BUILD IMAGE ONLY
      # ==========================================

      - name: Build LUNA Kernel Image
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$CLANG_DIR/bin:$PATH"

          JOBS="$(nproc)"

          echo "================================"
          echo "KERNEL      : LUNA"
          echo "COMPILER    : AOSP Clang r522817"
          echo "TARGET      : Image"
          echo "COMPRESSION : NONE"
          echo "CCACHE      : ENABLED"
          echo "JOBS        : $JOBS"
          echo "================================"

          make -j"$JOBS" O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image 2>&1 | tee build.log

          IMAGE="out/arch/arm64/boot/Image"

          test -s "$IMAGE"

          echo "========== IMAGE OUTPUT =========="

          ls -lh "$IMAGE"
          file "$IMAGE"
          sha256sum "$IMAGE"

      # ==========================================
      # VERIFY KERNEL RELEASE
      # ==========================================

      - name: Verify LUNA Kernel Release
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_FILE="out/include/config/kernel.release"

          test -s "$RELEASE_FILE"

          RELEASE="$(cat "$RELEASE_FILE")"

          echo "Kernel release: $RELEASE"

          # Exactly one LUNA suffix
          if [[ "$RELEASE" != *-LUNA ]]; then
            echo "ERROR: LUNA suffix missing!"
            exit 1
          fi

          if [[ "$RELEASE" == *-LUNA-LUNA ]]; then
            echo "ERROR: Duplicate LUNA suffix!"
            exit 1
          fi

          if [[ "$RELEASE" == *-g* || "$RELEASE" == *+ ]]; then
            echo "ERROR: Git suffix detected!"
            exit 1
          fi

          echo "LUNA kernel release verified!"

      # ==========================================
      # CCACHE STATISTICS
      # ==========================================

      - name: LUNA CCache Statistics
        if: always()
        shell: bash
        run: |
          echo "========== CCACHE STATISTICS =========="

          ccache --show-stats || true

          echo "========== CCACHE SIZE =========="

          du -sh "$CCACHE_DIR" || true

      # ==========================================
      # CLONE ANYKERNEL3
      # ==========================================

      - name: Clone AnyKernel3
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            anykernel

          test -f anykernel/tools/ak3-core.sh

      # ==========================================
      # CONFIGURE ANYKERNEL3
      # ==========================================

      - name: Configure LUNA AnyKernel3
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="out/arch/arm64/boot/Image"

          test -s "$IMAGE"

          cat > anykernel/anykernel.sh <<'EOF'
          #!/sbin/sh

          # ==========================================
          # LUNA KERNEL
          # Xiaomi Redmi Note 13 4G
          # Sapphire / SapphireN
          # AOSP Clang r522817
          # Image Uncompressed
          # Root None
          # ==========================================

          properties() { '
          kernel.string=LUNA Kernel
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0

          device.name1=sapphire
          device.name2=sapphiren

          supported.versions=
          supported.patchlevels=
          '

          block=boot
          is_slot_device=1
          ramdisk_compression=auto
          patch_vbmeta_flag=auto

          kernel=Image

          . tools/ak3-core.sh

          dump_boot
          write_boot
          EOF

          chmod 755 anykernel/anykernel.sh

          cp "$IMAGE" anykernel/Image

          rm -f anykernel/Image.gz

          test -s anykernel/Image

          echo "LUNA AnyKernel3 configured!"

      # ==========================================
      # CREATE FLASHABLE ZIP
      # ==========================================

      - name: Create LUNA Flashable ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          ZIP_NAME="LUNA-Sapphire-AOSP-Clang-r522817.zip"

          cd anykernel

          zip -r9 "../release/$ZIP_NAME" . \
            -x ".git/*" \
            -x "*.git*" \
            -x ".github/*"

          cd ..

          ZIP="release/$ZIP_NAME"

          test -s "$ZIP"

          unzip -t "$ZIP"

          echo "========== FLASHABLE ZIP =========="

          ls -lh "$ZIP"
          sha256sum "$ZIP"

      # ==========================================
      # VERIFY FINAL PACKAGE
      # ==========================================

      - name: Verify LUNA Package
        shell: bash
        run: |
          set -euo pipefail

          ZIP="release/LUNA-Sapphire-AOSP-Clang-r522817.zip"

          unzip -p "$ZIP" anykernel.sh \
            | grep -q 'kernel=Image'

          unzip -Z1 "$ZIP" | grep -Fxq "Image"

          if unzip -Z1 "$ZIP" | grep -q 'Image.gz'; then
            echo "ERROR: Image.gz found!"
            exit 1
          fi

          echo "LUNA package verified!"

      # ==========================================
      # UPLOAD FLASHABLE ZIP
      # ==========================================

      - name: Upload LUNA Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LUNA-Sapphire-AnyKernel3
          path: release/LUNA-Sapphire-AOSP-Clang-r522817.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # ==========================================
      # UPLOAD BUILD LOGS
      # ==========================================

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LUNA-Build-Logs
          path: |
            build.log
            out/.config
            out/include/config/kernel.release
          if-no-files-found: ignore
          retention-days: 7

      # ==========================================
      # FINAL BUILD SUMMARY
      # ==========================================

      - name: LUNA Build Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## LUNA Kernel Build"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Kernel | LUNA |"
            echo "| Device | Redmi Note 13 4G |"
            echo "| Codename | Sapphire / SapphireN |"
            echo "| Compiler | AOSP Clang r522817 |"
            echo "| Architecture | ARM64 |"
            echo "| Defconfig | $DEFCONFIG |"
            echo "| Target | Image |"
            echo "| Compression | Uncompressed |"
            echo "| CCache | Enabled |"
            echo "| CCache Size | 5 GB |"
            echo "| Clang Cache | Enabled |"
            echo "| Root | None |"
            echo "| Installer | AnyKernel3 |"
            echo "| Branch | ${{ inputs.branch }} |"
            echo "| Commit | $(git rev-parse --short HEAD) |"
            echo ""

            if [ -s release/LUNA-Sapphire-AOSP-Clang-r522817.zip ]; then
              echo "### LUNA ZIP created successfully"
            else
              echo "### Build failed or ZIP missing"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
