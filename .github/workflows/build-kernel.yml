
name: Sapphire | Full Clang Kernel Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Kernel source branch
        required: true
        default: lineage-23.2
        type: string

      clean_build:
        description: Clean build
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: sapphire-kernel-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  build:
    name: Sapphire - AOSP Clang r522817
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: vendor/sapphire_defconfig
      KBUILD_BUILD_USER: mobxprjkt
      KBUILD_BUILD_HOST: GitHub-Actions
      KBUILD_BUILD_VERSION: 1
      LLVM: "1"
      LLVM_IAS: "1"

    steps:
      # ==============================================
      # CHECKOUT SOURCE
      # ==============================================

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: mobxprjkt/kernel_xiaomi_sapphire
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          submodules: recursive

      - name: Kernel Information
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "DEVICE  : XIAOMI SAPPHIRE"
          echo "KERNEL  : $(make kernelversion)"
          echo "BRANCH  : ${{ inputs.branch }}"
          echo "COMMIT  : $(git rev-parse --short HEAD)"
          echo "DEFCONFIG: $DEFCONFIG"
          echo "================================"

          echo "## Kernel Information" >> "$GITHUB_STEP_SUMMARY"
          echo "- Device: Sapphire" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: ${{ inputs.branch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

      # ==============================================
      # DEPENDENCIES
      # ==============================================

      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ca-certificates \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            lz4 \
            pahole \
            python3 \
            python3-pip \
            rsync \
            unzip \
            zip \
            zlib1g-dev \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi

      # ==============================================
      # AOSP CLANG r522817
      # ==============================================

      - name: Download AOSP Clang r522817
        shell: bash
        run: |
          set -euo pipefail

          CLANG_DIR="$RUNNER_TEMP/clang"
          CLANG_ARCHIVE="$RUNNER_TEMP/clang-r522817.tar.gz"

          mkdir -p "$CLANG_DIR"

          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz"

          echo "Downloading AOSP Clang r522817..."

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            "$URL" \
            -o "$CLANG_ARCHIVE"

          tar -xzf "$CLANG_ARCHIVE" -C "$CLANG_DIR"

          test -x "$CLANG_DIR/bin/clang"
          test -x "$CLANG_DIR/bin/ld.lld"
          test -x "$CLANG_DIR/bin/llvm-ar"

          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"

          echo "========== CLANG =========="
          "$CLANG_DIR/bin/clang" --version
          echo "========== LLD =========="
          "$CLANG_DIR/bin/ld.lld" --version

      # ==============================================
      # TOOLCHAIN VERIFICATION
      # ==============================================

      - name: Verify Toolchain
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$CLANG_DIR/bin:$PATH"

          for tool in \
            clang \
            clang++ \
            ld.lld \
            llvm-ar \
            llvm-nm \
            llvm-objcopy \
            llvm-objdump \
            llvm-readelf \
            llvm-strip
          do
            command -v "$tool"
          done

          clang --version
          ld.lld --version

          echo "AOSP Clang toolchain verified!"

      # ==============================================
      # VALIDATE SOURCE
      # ==============================================

      - name: Validate Kernel Source
        shell: bash
        run: |
          set -euo pipefail

          test -f Makefile
          test -d arch/arm64
          test -f "arch/arm64/configs/$DEFCONFIG"

          echo "Defconfig found:"
          echo "arch/arm64/configs/$DEFCONFIG"

          echo "========== SOURCE CHECK =========="

          if ! grep -q "CONFIG_ARM64" \
            arch/arm64/Kconfig; then
            echo "Warning: ARM64 Kconfig check needs review"
          fi

      # ==============================================
      # CLEAN BUILD
      # ==============================================

      - name: Clean Build
        if: inputs.clean_build
        shell: bash
        run: |
          set -e

          rm -rf out
          make mrproper

          echo "Clean build completed!"

      # ==============================================
      # BUILD ENVIRONMENT
      # ==============================================

      - name: Setup Build Environment
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p out

          echo "KERNEL_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "OUT_DIR=$GITHUB_WORKSPACE/out" >> "$GITHUB_ENV"

      # ==============================================
      # CONFIGURE KERNEL
      # ==============================================

      - name: Configure Sapphire Defconfig
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$CLANG_DIR/bin:$PATH"

          make O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            "$DEFCONFIG"

          test -s out/.config

          echo "========== DEFCONFIG =========="

          grep -E \
            'CONFIG_ARM64=|CONFIG_ARCH_QCOM=|CONFIG_MODULES=|CONFIG_LOCALVERSION=' \
            out/.config || true

      # ==============================================
      # KERNEL BUILD
      # ==============================================

      - name: Build Kernel Image, DTBs and Modules
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$CLANG_DIR/bin:$PATH"

          JOBS="$(nproc)"

          echo "Building with $JOBS jobs..."

          make -j"$JOBS" O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz \
            dtbs \
            modules \
            2>&1 | tee build.log

          echo "Kernel build completed!"

      # ==============================================
      # VERIFY OUTPUT
      # ==============================================

      - name: Verify Build Output
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="out/arch/arm64/boot/Image.gz"

          if [ ! -s "$IMAGE" ]; then
            echo "ERROR: Image.gz missing!"
            exit 1
          fi

          echo "========== KERNEL IMAGE =========="
          ls -lh "$IMAGE"

          echo "========== DTBS =========="

          DTB_DIR="out/arch/arm64/boot/dts"

          if [ -d "$DTB_DIR" ]; then
            find "$DTB_DIR" -type f -name "*.dtb" -print
          else
            echo "No DTB directory found."
          fi

          echo "========== MODULES =========="

          find out -type f -name "*.ko" -print || true

          echo "========== CONFIG =========="

          grep -E \
            'CONFIG_LOCALVERSION=|CONFIG_MODULES=|CONFIG_ARCH_QCOM=' \
            out/.config || true

          sha256sum "$IMAGE"

      # ==============================================
      # DOWNLOAD ANYKERNEL3
      # ==============================================

      - name: Clone AnyKernel3
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            anykernel

          test -f anykernel/tools/ak3-core.sh

          echo "AnyKernel3 downloaded!"

      # ==============================================
      # CONFIGURE ANYKERNEL3
      # ==============================================

      - name: Configure Sapphire AnyKernel3
        shell: bash
        run: |
          set -euo pipefail

          cat > anykernel/anykernel.sh <<'EOF'
          #!/sbin/sh

          # AnyKernel3
          # Device: Xiaomi Redmi Note 13 4G
          # Codename: Sapphire
          # Compiler: AOSP Clang r522817
          # Root: None

          properties() {
            kernel.string=Sapphire AOSP Clang Kernel
            do.devicecheck=1
            do.modules=0
            do.systemless=0
            do.cleanup=1
            do.cleanuponabort=0

            device.name1=sapphire
            device.name2=sapphiren
            device.name3=
            device.name4=
            device.name5=

            supported.versions=
            supported.patchlevels=
          }

          block=boot
          is_slot_device=1
          ramdisk_compression=auto
          patch_vbmeta_flag=auto

          kernel=Image.gz

          . tools/ak3-core.sh

          dump_boot
          write_boot
          EOF

          chmod 755 anykernel/anykernel.sh

          cp out/arch/arm64/boot/Image.gz \
            anykernel/Image.gz

          test -s anykernel/Image.gz
          test -s anykernel/anykernel.sh

          echo "AnyKernel3 configured!"

      # ==============================================
      # PACKAGE FLASHABLE ZIP
      # ==============================================

      - name: Create Flashable ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          cd anykernel

          zip -r9 \
            "../release/Sapphire-AOSP-Clang-r522817-AnyKernel3.zip" \
            . \
            -x ".git/*" \
            -x "*.git*"

          cd ..

          ZIP="release/Sapphire-AOSP-Clang-r522817-AnyKernel3.zip"

          test -s "$ZIP"

          unzip -t "$ZIP"

          ls -lh "$ZIP"

      # ==============================================
      # COLLECT KERNEL ARTIFACTS
      # ==============================================

      - name: Collect Kernel Artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release/Kernel-Output/dtbs
          mkdir -p release/Kernel-Output/modules

          cp out/arch/arm64/boot/Image.gz \
            release/Kernel-Output/

          cp out/.config \
            release/Kernel-Output/kernel.config

          cp build.log \
            release/Kernel-Output/

          DTB_DIR="out/arch/arm64/boot/dts"

          if [ -d "$DTB_DIR" ]; then
            find "$DTB_DIR" -type f -name "*.dtb" \
              -exec cp --parents {} release/Kernel-Output/dtbs/ \;
          fi

          find out -type f -name "*.ko" \
            -exec cp --parents {} release/Kernel-Output/modules/ \;

          {
            echo "Device: Xiaomi Redmi Note 13 4G"
            echo "Codename: Sapphire"
            echo "Kernel: $(make kernelversion)"
            echo "Compiler: AOSP Clang r522817"
            echo "Architecture: ARM64"
            echo "Defconfig: $DEFCONFIG"
            echo "Root: None"
            echo "Packaging: AnyKernel3"
            echo "Branch: ${{ inputs.branch }}"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Build Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          } > release/Kernel-Output/BUILD_INFO.txt

          echo "Artifacts collected!"

      # ==============================================
      # UPLOAD FLASHABLE ZIP
      # ==============================================

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Sapphire-AnyKernel3-Clang-r522817
          path: release/Sapphire-AOSP-Clang-r522817-AnyKernel3.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # ==============================================
      # UPLOAD FULL KERNEL OUTPUT
      # ==============================================

      - name: Upload Full Kernel Output
        uses: actions/upload-artifact@v4
        with:
          name: Sapphire-Kernel-Output-Clang-r522817
          path: release/Kernel-Output/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      # ==============================================
      # UPLOAD BUILD LOGS ON FAILURE
      # ==============================================

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sapphire-Build-Logs
          path: |
            build.log
            out/.config
          if-no-files-found: ignore
          retention-days: 7

      # ==============================================
      # BUILD SUMMARY
      # ==============================================

      - name: Build Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Sapphire Kernel Build"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Device | Xiaomi Redmi Note 13 4G |"
            echo "| Codename | Sapphire |"
            echo "| Kernel | $(make kernelversion 2>/dev/null || echo Unknown) |"
            echo "| Compiler | AOSP Clang r522817 |"
            echo "| Architecture | ARM64 |"
            echo "| Defconfig | $DEFCONFIG |"
            echo "| Root | None |"
            echo "| Packaging | AnyKernel3 |"
            echo "| Branch | ${{ inputs.branch }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -s release/Sapphire-AOSP-Clang-r522817-AnyKernel3.zip ]; then
            echo "### Flashable ZIP created successfully" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Build failed or ZIP missing" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
