
name: luna | Sapphire Kernel Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Kernel source branch
        required: true
        default: lineage-23.2
        type: string

      clean_build:
        description: Clean build
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: luna-sapphire-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  build:
    name: luna - AOSP Clang r522817
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: vendor/sapphire_defconfig

      KBUILD_BUILD_USER: luna
      KBUILD_BUILD_HOST: Sapphire
      KBUILD_BUILD_VERSION: 1

      LOCALVERSION: "-luna"
      LLVM: "1"
      LLVM_IAS: "1"

    steps:

      # ==========================================
      # CHECKOUT SOURCE
      # ==========================================

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: mobxprjkt/kernel_xiaomi_sapphire
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          submodules: recursive

      - name: Kernel Information
        shell: bash
        run: |
          set -euo pipefail

          echo "================================"
          echo "KERNEL   : luna"
          echo "DEVICE   : Redmi Note 13 4G"
          echo "CODENAME : Sapphire / SapphireN"
          echo "BRANCH   : ${{ inputs.branch }}"
          echo "COMMIT   : $(git rev-parse --short HEAD)"
          echo "KERNEL   : $(make kernelversion)"
          echo "================================"

      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ca-certificates \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            lz4 \
            pahole \
            python3 \
            python3-pip \
            rsync \
            unzip \
            zip \
            zlib1g-dev \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi

      # ==========================================
      # DOWNLOAD AOSP CLANG r522817
      # ==========================================

      - name: Download AOSP Clang r522817
        shell: bash
        run: |
          set -euo pipefail

          CLANG_DIR="$RUNNER_TEMP/clang"
          CLANG_ARCHIVE="$RUNNER_TEMP/clang-r522817.tar.gz"

          mkdir -p "$CLANG_DIR"

          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz"

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            "$URL" \
            -o "$CLANG_ARCHIVE"

          tar -xzf "$CLANG_ARCHIVE" -C "$CLANG_DIR"

          test -x "$CLANG_DIR/bin/clang"
          test -x "$CLANG_DIR/bin/ld.lld"
          test -x "$CLANG_DIR/bin/llvm-ar"

          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"

          "$CLANG_DIR/bin/clang" --version

      # ==========================================
      # VERIFY TOOLCHAIN
      # ==========================================

      - name: Verify Toolchain
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$CLANG_DIR/bin:$PATH"

          for tool in clang clang++ ld.lld llvm-ar \
                      llvm-nm llvm-objcopy llvm-objdump \
                      llvm-readelf llvm-strip; do
            command -v "$tool"
          done

          clang --version
          ld.lld --version

      # ==========================================
      # VALIDATE SOURCE
      # ==========================================

      - name: Validate Kernel Source
        shell: bash
        run: |
          set -euo pipefail

          test -f Makefile
          test -d arch/arm64
          test -f "arch/arm64/configs/$DEFCONFIG"

          echo "Kernel source validated!"

      # ==========================================
      # CLEAN BUILD
      # ==========================================

      - name: Clean Build
        if: inputs.clean_build
        shell: bash
        run: |
          set -euo pipefail

          rm -rf out
          make mrproper

          echo "Clean build completed!"

      # ==========================================
      # SETUP BUILD ENVIRONMENT
      # ==========================================

      - name: Setup Build Environment
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p out

          echo "KERNEL_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "OUT_DIR=$GITHUB_WORKSPACE/out" >> "$GITHUB_ENV"

      # ==========================================
      # CONFIGURE DEFCONFIG
      # ==========================================

      - name: Configure Sapphire Defconfig
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$CLANG_DIR/bin:$PATH"

          make O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            "$DEFCONFIG"

          test -s out/.config

      # ==========================================
      # PATCH KERNEL NAME
      # ==========================================

      - name: Apply luna Kernel Name
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="out/.config"

          # Kernel release suffix
          scripts/config --file "$CONFIG" \
            --set-str LOCALVERSION "-luna"

          # Disable automatic Git hash and dirty suffix
          scripts/config --file "$CONFIG" \
            -d LOCALVERSION_AUTO

          # Ensure generated config is updated
          make O=out ARCH=arm64 olddefconfig

          # Export build identity
          echo "KBUILD_BUILD_USER=luna" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_HOST=Sapphire" >> "$GITHUB_ENV"
          echo "LOCALVERSION=-luna" >> "$GITHUB_ENV"

          # Verify
          grep -E \
            'CONFIG_LOCALVERSION=|CONFIG_LOCALVERSION_AUTO=' \
            out/.config || true

          rm -f out/include/config/kernel.release

          echo "luna kernel identity configured!"

      # ==========================================
      # BUILD IMAGE ONLY
      # ==========================================

      - name: Build luna Kernel Image
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$CLANG_DIR/bin:$PATH"

          JOBS="$(nproc)"

          echo "================================"
          echo "KERNEL      : luna"
          echo "COMPILER    : AOSP Clang r522817"
          echo "TARGET      : Image"
          echo "COMPRESSION : NONE"
          echo "JOBS        : $JOBS"
          echo "================================"

          make -j"$JOBS" O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image 2>&1 | tee build.log

          IMAGE="out/arch/arm64/boot/Image"

          test -s "$IMAGE"

          echo "========== IMAGE =========="

          ls -lh "$IMAGE"
          file "$IMAGE"
          sha256sum "$IMAGE"

      # ==========================================
      # VERIFY KERNEL RELEASE
      # ==========================================

      - name: Verify luna Kernel Release
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_FILE="out/include/config/kernel.release"

          if [ ! -s "$RELEASE_FILE" ]; then
            echo "ERROR: Kernel release missing!"
            exit 1
          fi

          RELEASE="$(cat "$RELEASE_FILE")"

          echo "Kernel release: $RELEASE"

          case "$RELEASE" in
            *-luna) ;;
            *)
              echo "ERROR: luna suffix missing!"
              exit 1
              ;;
          esac

          if echo "$RELEASE" | grep -Eq -- '-g[0-9a-f]{7,}|\+$'; then
            echo "ERROR: Git suffix detected!"
            exit 1
          fi

          echo "luna kernel release verified!"

      # ==========================================
      # CLONE ANYKERNEL3
      # ==========================================

      - name: Clone AnyKernel3
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            anykernel

          test -f anykernel/tools/ak3-core.sh

      # ==========================================
      # CONFIGURE ANYKERNEL3
      # ==========================================

      - name: Configure luna AnyKernel3
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="out/arch/arm64/boot/Image"

          test -s "$IMAGE"

          cat > anykernel/anykernel.sh <<'EOF'
          #!/sbin/sh

          # ==========================================
          # luna KERNEL
          # Xiaomi Redmi Note 13 4G
          # Sapphire / SapphireN
          # AOSP Clang r522817
          # Image Uncompressed
          # Root None
          # ==========================================

          properties() { '
          kernel.string=luna Kernel
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0

          device.name1=sapphire
          device.name2=sapphiren

          supported.versions=
          supported.patchlevels=
          '

          block=boot
          is_slot_device=1
          ramdisk_compression=auto
          patch_vbmeta_flag=auto

          kernel=Image

          . tools/ak3-core.sh

          dump_boot
          write_boot
          EOF

          chmod 755 anykernel/anykernel.sh

          cp "$IMAGE" anykernel/Image

          rm -f anykernel/Image.gz

          test -s anykernel/Image

          echo "luna AnyKernel3 configured!"

      # ==========================================
      # CREATE FLASHABLE ZIP
      # ==========================================

      - name: Create luna Flashable ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          ZIP_NAME="luna-Sapphire-AOSP-Clang-r522817.zip"

          cd anykernel

          zip -r9 "../release/$ZIP_NAME" . \
            -x ".git/*" \
            -x "*.git*" \
            -x ".github/*"

          cd ..

          ZIP="release/$ZIP_NAME"

          test -s "$ZIP"

          unzip -t "$ZIP"

          echo "========== FLASHABLE ZIP =========="

          ls -lh "$ZIP"
          sha256sum "$ZIP"

      # ==========================================
      # VERIFY FLASHABLE ZIP
      # ==========================================

      - name: Verify luna Package
        shell: bash
        run: |
          set -euo pipefail

          ZIP="release/luna-Sapphire-AOSP-Clang-r522817.zip"

          unzip -p "$ZIP" anykernel.sh \
            | grep -q 'kernel=Image'

          unzip -Z1 "$ZIP" | grep -Fxq "Image"

          if unzip -Z1 "$ZIP" | grep -q 'Image.gz'; then
            echo "ERROR: Image.gz found!"
            exit 1
          fi

          echo "luna package verified!"

      # ==========================================
      # UPLOAD FLASHABLE ZIP
      # ==========================================

      - name: Upload luna Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: luna-Sapphire-AnyKernel3
          path: release/luna-Sapphire-AOSP-Clang-r522817.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # ==========================================
      # UPLOAD BUILD LOGS
      # ==========================================

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: luna-Build-Logs
          path: |
            build.log
            out/.config
            out/include/config/kernel.release
          if-no-files-found: ignore
          retention-days: 7

      # ==========================================
      # BUILD SUMMARY
      # ==========================================

      - name: Build Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## luna Kernel Build"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Kernel Name | luna |"
            echo "| Device | Redmi Note 13 4G |"
            echo "| Codename | Sapphire / SapphireN |"
            echo "| Compiler | AOSP Clang r522817 |"
            echo "| Architecture | ARM64 |"
            echo "| Defconfig | $DEFCONFIG |"
            echo "| Target | Image |"
            echo "| Compression | Uncompressed |"
            echo "| Root | None |"
            echo "| Installer | AnyKernel3 |"
            echo "| Branch | ${{ inputs.branch }} |"
            echo "| Commit | $(git rev-parse --short HEAD) |"
            echo ""

            if [ -s release/luna-Sapphire-AOSP-Clang-r522817.zip ]; then
              echo "### luna ZIP created successfully"
            else
              echo "### Build failed or ZIP missing"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
